<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
  <title>LOFTER Lite</title>
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
  <meta name="description" content="一个只留内容的 LOFTER 第三方客户端">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="header" class="header"></header>
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar" aria-label="主导航"></nav>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" aria-label="关闭">✕</button>
    <div class="lb-track"></div>
    <div class="lb-count"></div>
  </div>

  <div id="sheet" class="sheet-wrap" hidden>
    <div class="sheet-mask"></div>
    <div class="sheet"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="native-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
